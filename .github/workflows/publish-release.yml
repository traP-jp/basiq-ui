name: Publish release

run-name: Publish release from ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.release_change.outputs.should_publish }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect package version change
        id: release_change
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if [[ ! "$BEFORE_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
            [[ "$BEFORE_COMMIT" == "0000000000000000000000000000000000000000" ]]; then
            echo "GitHub returned an invalid previous commit." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid release commit." >&2
            exit 1
          fi

          actual_commit="$(git rev-parse HEAD)"
          previous_commit="$(git rev-parse HEAD^)"

          if [[ "$actual_commit" != "$RELEASE_COMMIT" ]]; then
            echo "The checked-out commit does not match the push event." >&2
            exit 1
          fi

          if [[ "$previous_commit" != "$BEFORE_COMMIT" ]]; then
            echo "A release push must contain exactly one squashed commit." >&2
            exit 1
          fi

          previous_package="$RUNNER_TEMP/package-before-push.json"
          git show "${BEFORE_COMMIT}:package.json" > "$previous_package"

          previous_version="$(jq --exit-status --raw-output '.version | strings | select(length > 0)' "$previous_package")"
          current_version="$(jq --exit-status --raw-output '.version | strings | select(length > 0)' package.json)"

          if [[ "$previous_version" == "$current_version" ]]; then
            echo "package.json changed without a version change; nothing will be published."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BEFORE_COMMIT" "$RELEASE_COMMIT")"
          if [[ "$changed_files" != "package.json" ]]; then
            echo "A version-changing release commit must modify only package.json." >&2
            echo "Changed files:" >&2
            echo "$changed_files" >&2
            exit 1
          fi

          echo "Detected package version change: $previous_version -> $current_version"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish or verify npm package
    needs:
      - detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      is_prerelease: ${{ steps.publish_plan.outputs.is_prerelease }}
      npm_dist_tag: ${{ steps.publish_plan.outputs.npm_dist_tag }}
      package_was_published: ${{ steps.npm_state.outputs.should_publish }}
      release_commit: ${{ steps.publish_plan.outputs.release_commit }}
      tag_name: ${{ steps.publish_plan.outputs.tag_name }}
      version: ${{ steps.publish_plan.outputs.version }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.3
          sha256: 66585ac496c10bf6fbf13272e3e550c1813aed0e1cb780b9bb73c1751de49289
          install_args: --locked
          cache: false

      - name: Create publish plan
        id: publish_plan
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid release commit." >&2
            exit 1
          fi

          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "The checked-out commit does not match the push event." >&2
            exit 1
          fi

          plan="$(node scripts/create-publish-plan.mjs)"
          version="$(jq --raw-output '.version' <<< "$plan")"
          tag_name="$(jq --raw-output '.tagName' <<< "$plan")"
          npm_dist_tag="$(jq --raw-output '.npmDistTag' <<< "$plan")"
          is_prerelease="$(jq --raw-output '.prerelease' <<< "$plan")"

          {
            echo "version=$version"
            echo "tag_name=$tag_name"
            echo "npm_dist_tag=$npm_dist_tag"
            echo "is_prerelease=$is_prerelease"
            echo "release_commit=$actual_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight GitHub release state
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.publish_plan.outputs.is_prerelease }}
          RELEASE_COMMIT: ${{ steps.publish_plan.outputs.release_commit }}
          RELEASE_TAG: ${{ steps.publish_plan.outputs.tag_name }}
        run: |
          tag_file="$RUNNER_TEMP/github-tag.json"
          tag_status="$(
            curl \
              --retry 3 \
              --retry-all-errors \
              --silent \
              --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$tag_file" \
              --write-out "%{http_code}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          )"

          case "$tag_status" in
            200)
              tag_type="$(jq --raw-output '.object.type' "$tag_file")"
              tag_commit="$(jq --raw-output '.object.sha' "$tag_file")"

              if [[ "$tag_type" != "commit" || "$tag_commit" != "$RELEASE_COMMIT" ]]; then
                echo "Git tag $RELEASE_TAG does not point to the release commit." >&2
                exit 1
              fi
              ;;
            404)
              ;;
            *)
              echo "GitHub tag API returned HTTP $tag_status." >&2
              exit 1
              ;;
          esac

          releases_file="$RUNNER_TEMP/github-releases.json"
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName,isDraft,isPrerelease \
            > "$releases_file"

          matching_release_count="$(
            jq --raw-output --arg tag "$RELEASE_TAG" \
              '[.[] | select(.tagName == $tag)] | length' \
              "$releases_file"
          )"

          if [[ "$matching_release_count" -gt 1 ]]; then
            echo "Multiple GitHub Releases use tag $RELEASE_TAG." >&2
            exit 1
          fi

          if [[ "$matching_release_count" == "1" ]]; then
            release_is_draft="$(
              jq --raw-output --arg tag "$RELEASE_TAG" \
                '.[] | select(.tagName == $tag) | .isDraft' \
                "$releases_file"
            )"
            release_is_prerelease="$(
              jq --raw-output --arg tag "$RELEASE_TAG" \
                '.[] | select(.tagName == $tag) | .isPrerelease' \
                "$releases_file"
            )"

            if [[ "$release_is_draft" != "false" ]]; then
              echo "GitHub Release $RELEASE_TAG already exists as a draft." >&2
              exit 1
            fi

            if [[ "$tag_status" != "200" || "$release_is_prerelease" != "$IS_PRERELEASE" ]]; then
              echo "GitHub Release $RELEASE_TAG is not in the expected published state." >&2
              exit 1
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Create package tarball
        id: package
        env:
          RELEASE_VERSION: ${{ steps.publish_plan.outputs.version }}
        run: |
          pack_result="$(npm pack --ignore-scripts --json)"
          filename="$(jq --raw-output '.[0].filename // empty' <<< "$pack_result")"
          integrity="$(jq --raw-output '.[0].integrity // empty' <<< "$pack_result")"
          expected_filename="basiq-ui-$RELEASE_VERSION.tgz"

          if [[ "$filename" != "$expected_filename" || ! -f "$filename" ]]; then
            echo "npm pack did not create $expected_filename." >&2
            exit 1
          fi

          if [[ ! "$integrity" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "npm pack returned an invalid integrity value." >&2
            exit 1
          fi

          jq '.[0] | {filename, integrity, files: [.files[].path]}' <<< "$pack_result"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Verify package tarball metadata
        env:
          NPM_DIST_TAG: ${{ steps.publish_plan.outputs.npm_dist_tag }}
          RELEASE_VERSION: ${{ steps.publish_plan.outputs.version }}
        run: |
          if [[ ${#RELEASE_VERSION} -gt 256 ]] ||
            [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Publish plan returned an invalid release version." >&2
            exit 1
          fi

          expected_dist_tag="latest"
          if [[ "$RELEASE_VERSION" == *-beta.* ]]; then
            expected_dist_tag="next"
          fi

          if [[ "$NPM_DIST_TAG" != "$expected_dist_tag" ]]; then
            echo "Publish plan returned an unexpected npm dist-tag." >&2
            exit 1
          fi

          tarball_filename="basiq-ui-$RELEASE_VERSION.tgz"
          if [[ ! -f "$tarball_filename" ]]; then
            echo "Package tarball not found: $tarball_filename" >&2
            exit 1
          fi

          package_json="$RUNNER_TEMP/package.json"
          tar --extract --gzip --to-stdout --file="$tarball_filename" -- package/package.json > "$package_json"

          if ! jq --exit-status --arg version "$RELEASE_VERSION" '
            .name == "basiq-ui" and
            .version == $version and
            .private != true and
            .repository.url == "git+https://github.com/traP-jp/basiq-ui.git" and
            .publishConfig.access == "public" and
            .publishConfig.provenance == true and
            ((.publishConfig.registry // "https://registry.npmjs.org/") == "https://registry.npmjs.org/")
          ' "$package_json" > /dev/null; then
            echo "Package tarball contains unexpected metadata." >&2
            exit 1
          fi

      - name: Check npm release state
        id: npm_state
        env:
          NPM_DIST_TAG: ${{ steps.publish_plan.outputs.npm_dist_tag }}
          RELEASE_VERSION: ${{ steps.publish_plan.outputs.version }}
          TARBALL_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          registry_file="$RUNNER_TEMP/npm-package.json"
          registry_status="$(
            curl \
              --retry 3 \
              --retry-all-errors \
              --silent \
              --show-error \
              --output "$registry_file" \
              --write-out "%{http_code}" \
              "https://registry.npmjs.org/basiq-ui"
          )"

          current_dist_tag_version=""
          published_integrity=""
          version_exists="false"

          case "$registry_status" in
            200)
              current_dist_tag_version="$(
                jq --raw-output --arg tag "$NPM_DIST_TAG" '."dist-tags"[$tag] // ""' "$registry_file"
              )"
              version_exists="$(
                jq --raw-output --arg version "$RELEASE_VERSION" \
                  'if .versions[$version] then "true" else "false" end' "$registry_file"
              )"
              published_integrity="$(
                jq --raw-output --arg version "$RELEASE_VERSION" \
                  '.versions[$version].dist.integrity // ""' "$registry_file"
              )"
              ;;
            404)
              ;;
            *)
              echo "npm registry returned HTTP $registry_status." >&2
              exit 1
              ;;
          esac

          compare_versions() {
            CURRENT_VERSION="$1" TARGET_VERSION="$2" node --input-type=module --eval '
              import { compareParsedReleaseVersions, parseReleaseVersion } from "./scripts/release-version.mjs";

              const current = parseReleaseVersion(process.env.CURRENT_VERSION);
              const target = parseReleaseVersion(process.env.TARGET_VERSION);
              process.stdout.write(String(compareParsedReleaseVersions(target, current)));
            '
          }

          if [[ "$version_exists" == "true" ]]; then
            if [[ "$published_integrity" != "$TARBALL_INTEGRITY" ]]; then
              echo "Published tarball integrity does not match the package tarball." >&2
              exit 1
            fi

            if [[ -z "$current_dist_tag_version" ]]; then
              echo "npm dist-tag $NPM_DIST_TAG is missing." >&2
              exit 1
            fi

            comparison="$(compare_versions "$current_dist_tag_version" "$RELEASE_VERSION")"
            if [[ "$comparison" == "1" ]]; then
              echo "npm dist-tag $NPM_DIST_TAG points to an older version." >&2
              exit 1
            fi

            should_publish="false"
          else
            if [[ -n "$current_dist_tag_version" ]]; then
              comparison="$(compare_versions "$current_dist_tag_version" "$RELEASE_VERSION")"
              if [[ "$comparison" != "1" ]]; then
                echo "Release version $RELEASE_VERSION must be newer than npm dist-tag version $current_dist_tag_version." >&2
                exit 1
              fi
            fi

            should_publish="true"
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Verify Trusted Publishing environment
        if: steps.npm_state.outputs.should_publish == 'true'
        run: |
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] ||
            [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions did not provide the OIDC request environment." >&2
            exit 1
          fi

          if [[ -n "${NODE_AUTH_TOKEN:-}" ]] || [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "Trusted Publishing must run without an npm publish token." >&2
            exit 1
          fi

          echo "GitHub Actions OIDC request environment is available."

      - name: Publish package
        if: steps.npm_state.outputs.should_publish == 'true'
        env:
          NPM_DIST_TAG: ${{ steps.publish_plan.outputs.npm_dist_tag }}
          RELEASE_VERSION: ${{ steps.publish_plan.outputs.version }}
        run: |
          npm publish "./basiq-ui-$RELEASE_VERSION.tgz" \
            --access public \
            --ignore-scripts \
            --loglevel verbose \
            --provenance \
            --registry "https://registry.npmjs.org/" \
            --tag "$NPM_DIST_TAG"

          echo "Published basiq-ui@$RELEASE_VERSION with npm dist-tag $NPM_DIST_TAG." >> "$GITHUB_STEP_SUMMARY"

      - name: Report existing package
        if: steps.npm_state.outputs.should_publish == 'false'
        env:
          RELEASE_VERSION: ${{ steps.publish_plan.outputs.version }}
        run: echo "Verified existing basiq-ui@$RELEASE_VERSION with the expected integrity." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create or verify GitHub release
    needs:
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Reconcile Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.publish.outputs.is_prerelease }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [[ ${#RELEASE_VERSION} -gt 256 ]] ||
            [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Publish job returned an invalid release version." >&2
            exit 1
          fi

          expected_tag="v$RELEASE_VERSION"
          expected_prerelease="false"
          if [[ "$RELEASE_VERSION" == *-beta.* ]]; then
            expected_prerelease="true"
          fi

          if [[ "$RELEASE_TAG" != "$expected_tag" || "$IS_PRERELEASE" != "$expected_prerelease" ]]; then
            echo "Publish job returned inconsistent release metadata." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Publish job returned an invalid release commit." >&2
            exit 1
          fi

          tag_file="$RUNNER_TEMP/github-tag.json"
          tag_status="$(
            curl \
              --retry 3 \
              --retry-all-errors \
              --silent \
              --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$tag_file" \
              --write-out "%{http_code}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          )"

          case "$tag_status" in
            200)
              tag_type="$(jq --raw-output '.object.type' "$tag_file")"
              tag_commit="$(jq --raw-output '.object.sha' "$tag_file")"

              if [[ "$tag_type" != "commit" || "$tag_commit" != "$RELEASE_COMMIT" ]]; then
                echo "Git tag $RELEASE_TAG does not point to the release commit." >&2
                exit 1
              fi
              ;;
            404)
              ;;
            *)
              echo "GitHub tag API returned HTTP $tag_status." >&2
              exit 1
              ;;
          esac

          release_file="$RUNNER_TEMP/github-release.json"
          release_status="$(
            curl \
              --retry 3 \
              --retry-all-errors \
              --silent \
              --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$release_file" \
              --write-out "%{http_code}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )"

          case "$release_status" in
            200)
              release_is_prerelease="$(jq --raw-output '.prerelease' "$release_file")"

              if [[ "$tag_status" != "200" || "$release_is_prerelease" != "$IS_PRERELEASE" ]]; then
                echo "GitHub Release $RELEASE_TAG is not in the expected published state." >&2
                exit 1
              fi

              echo "GitHub Release $RELEASE_TAG already exists."
              exit 0
              ;;
            404)
              ;;
            *)
              echo "GitHub Release API returned HTTP $release_status." >&2
              exit 1
              ;;
          esac

          release_arguments=(
            "$RELEASE_TAG"
            --generate-notes
            --title "$RELEASE_TAG"
          )

          if [[ "$tag_status" == "200" ]]; then
            release_arguments+=(--verify-tag)
          else
            release_arguments+=(--target "$RELEASE_COMMIT")
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_arguments+=(--prerelease)
          fi

          gh release create \
            --repo "$GITHUB_REPOSITORY" \
            "${release_arguments[@]}"

      - name: Report release
        env:
          NPM_DIST_TAG: ${{ needs.publish.outputs.npm_dist_tag }}
          PACKAGE_WAS_PUBLISHED: ${{ needs.publish.outputs.package_was_published }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          echo "## Release complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PACKAGE_WAS_PUBLISHED" == "true" ]]; then
            echo "Published basiq-ui@$RELEASE_VERSION with npm dist-tag $NPM_DIST_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verified existing basiq-ui@$RELEASE_VERSION with npm dist-tag $NPM_DIST_TAG." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "GitHub Release: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
